[workspace]
members = [".", "crates/peam-consensus-types", "crates/peam-state", "crates/peam-fork-choice", "crates/peam-storage"]
resolver = "2"

[package]
name = "peam"
version = "0.1.0"
edition = "2024"

[dependencies]
peam-consensus-types = { path = "crates/peam-consensus-types" }
peam-fork-choice = { path = "crates/peam-fork-choice" }
peam-state = { path = "crates/peam-state" }
peam-storage = { path = "crates/peam-storage" }
peam-ssz = "2.0.1"
sha2 = "0.10"
rapidhash = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
libp2p = { version = "0.54", features = ["tokio", "tcp", "dns", "noise", "yamux", "quic", "gossipsub", "request-response", "identify", "mdns", "secp256k1"] }
futures = "0.3"
async-trait = "0.1"
libp2p-swarm-derive = "0.35.1"
leansig = { git = "https://github.com/leanEthereum/leanSig.git", branch = "devnet4" }
lean-multisig = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "2eb4b9d983171139af36749f127dd9890c9109e6" }
ssz = { package = "ethereum_ssz", version = "0.10.1" }
rand = { version = "0.10" }
snap = "1.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
ureq = "2"
enr = "0.13"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["stats"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"
rayon = "1"
serde_json = "1"
ssz_types = { git = "https://github.com/sigp/ssz_types.git", rev = "5dc2d521ed31f8e38b0065a80bf98af55aac06f8" }
ssz = { package = "ethereum_ssz", version = "0.10.1" }

[[bench]]
name = "bitlist_compare"
harness = false

[[bench]]
name = "merkleize_loop"
harness = false

[[bench]]
name = "chunkify_fixed"
harness = false

[[bench]]
name = "storage_open"
harness = false

[[bench]]
name = "storage_lookup"
harness = false

[[bench]]
name = "index_rebuild_strategy"
harness = false

[[bench]]
name = "index_text_strategy"
harness = false

[[bench]]
name = "pq_signature_baseline"
harness = false

[[bench]]
name = "proposal_head_pending"
harness = false

[[bench]]
name = "verify_signed_block_gather"
harness = false
