[package]
name = "peam"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
rapidhash = "1.0"
redb = "3.1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
libp2p = { version = "0.54", features = ["tokio", "tcp", "dns", "noise", "yamux", "quic", "gossipsub", "request-response", "identify", "ping", "mdns", "secp256k1"] }
futures = "0.3"
async-trait = "0.1"
libp2p-swarm-derive = "0.35.1"
leansig = { git = "https://github.com/leanEthereum/leanSig.git", rev = "73bedc26ed961b110df7ac2e234dc11361a4bf25" }
lean-multisig = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "e4474138487eeb1ed7c2e1013674fe80ac9f3165" }
ssz = { package = "ethereum_ssz", version = "0.10.1" }
rand = { version = "0.9" }
snap = "1.1"

[patch."https://github.com/leanEthereum/fiat-shamir.git"]
fiat-shamir = { path = "./fiat-shamir" }

[patch."https://github.com/leanEthereum/multilinear-toolkit.git"]
multilinear-toolkit = { path = "../ream/vendor/multilinear-toolkit" }

[patch."https://github.com/leanEthereum/leanMultisig.git"]
lean-multisig = { path = "../ream/vendor/leanMultisig" }

[patch."https://github.com/TomWambsgans/whir-p3"]
whir-p3 = { path = "./whir-p3" }

[patch."https://github.com/TomWambsgans/whir-p3.git"]
whir-p3 = { path = "./whir-p3" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssz_types = { git = "https://github.com/sigp/ssz_types.git", rev = "5dc2d521ed31f8e38b0065a80bf98af55aac06f8" }
ssz = { package = "ethereum_ssz", version = "0.10.1" }

[[bench]]
name = "compare_ream"
harness = false

[[bench]]
name = "bitlist_compare"
harness = false

[[bench]]
name = "merkleize_loop"
harness = false

[[bench]]
name = "chunkify_fixed"
harness = false

[[bench]]
name = "storage_open"
harness = false

[[bench]]
name = "storage_lookup"
harness = false

[[bench]]
name = "index_rebuild_strategy"
harness = false

[[bench]]
name = "index_text_strategy"
harness = false

[[bench]]
name = "pq_signature_baseline"
harness = false

[[bench]]
name = "proposal_head_pending"
harness = false

[[bench]]
name = "verify_signed_block_gather"
harness = false
