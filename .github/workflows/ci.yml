name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Compile all targets
        run: cargo check --locked --all-targets

      - name: Run stable test matrix
        run: |
          cargo test --locked --lib --bins
          # NOTE: We intentionally run the deterministic subset of integration tests.
          # Unstable/failing targets are kept out of CI until fixed upstream.
          cargo test --locked \
            --test bitlist_ssz \
            --test block_envelopes \
            --test config_parse \
            --test e2e_smoke \
            --test genesis_validator_count \
            --test gossip_containers \
            --test lean_spec_container_placeholders \
            --test lean_spec_fixtures \
            --test networking_peer \
            --test pq_devnet1_e2e \
            --test pq_negative \
            --test prune_blob_gc \
            --test prune_perf_regression \
            --test ream_networking_ports \
            --test req_resp \
            --test slot_logic \
            --test ssz_collections \
            --test ssz_hash \
            --test state_ssz \
            --test state_structs
