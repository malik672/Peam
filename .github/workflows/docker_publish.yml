name: Publish Docker Image

on:
  push:
    branches: [master]
    tags:
      - "v*"
      - "devnet*"
      - "Devnet*"
  workflow_dispatch:
    inputs:
      tags:
        description: "Additional Docker tags, comma-separated (for example: latest,devnet3)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: peam
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}"
          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ref_name="${GITHUB_REF_NAME}"

          declare -a tags
          tags+=("${image}:sha-${short_sha}")

          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            tags+=("${image}:latest")
            tags+=("${image}:devnet3")
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=("${image}:${ref_name}")
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -n "${{ inputs.tags }}" ]]; then
            IFS=',' read -ra extra_tags <<< "${{ inputs.tags }}"
            for tag in "${extra_tags[@]}"; do
              tag="$(echo "${tag}" | xargs)"
              if [[ -n "${tag}" ]]; then
                tags+=("${image}:${tag}")
              fi
            done
          fi

          unique_tags="$(printf '%s\n' "${tags[@]}" | awk '!seen[$0]++')"

          {
            echo "tags<<EOF"
            echo "${unique_tags}"
            echo "EOF"
            echo "created=${build_date}"
            echo "source=https://github.com/${GITHUB_REPOSITORY}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=peam
            org.opencontainers.image.description=Minimal Lean Consensus client
            org.opencontainers.image.source=${{ steps.meta.outputs.source }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            IMAGE_SOURCE=${{ steps.meta.outputs.source }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
