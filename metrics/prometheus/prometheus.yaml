global:
  scrape_interval: 4s
  scrape_timeout: 4s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "lean-clients"
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels:
          instance: peam
          client: peam
      - targets: ["host.docker.internal:18081"]
        labels:
          instance: peer1
          client: peer1
      - targets: ["host.docker.internal:18082"]
        labels:
          instance: peer2
          client: peer2
      - targets: ["host.docker.internal:18083"]
        labels:
          instance: peer3
          client: peer3
